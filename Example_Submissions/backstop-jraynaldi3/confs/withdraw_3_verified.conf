{
  "build_script": "../certora_build.py",
  "optimistic_loop": true,
  "loop_iter": "2",
  "precise_bitwise_ops": true,
  "process": "emv",
  "rule": [
    "ew_pop_q4w"
  ],
  "smt_timeout": "7200",
  "prover_args": [
    "-split false",
    "-splitParallel true",
    "-dontStopAtFirstSplitTimeout true",
    "-smt_preciseBitwiseOps"
  ],
  "mutations": {
    "manual_mutants": [
      {
        "file_to_mutate": "../src/backstop/withdrawal.rs",
        "mutants_location": "../mutations/withdraw-merged"
      }
    ]
  }
}