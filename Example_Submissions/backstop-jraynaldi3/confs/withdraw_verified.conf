{
  "build_script": "../certora_build.py",
  "optimistic_loop": true,
  "loop_iter": "2",
  "precise_bitwise_ops": true,
  "process": "emv",
  "rule": [
    "ew_amount_to_withdraw_nonnegative",
    "ew_revert_zero_return",
    "eqw_only_positive",
    "eqw_reduce_balance",
    "eqw_return_value",
    "eqw_add_pool_queue",
    "edw_only_positive",
    "edw_add_user_shares",
    "edw_pop_q4w",
    "edw_added_shares_lte_q4w_amount",
    "edw_reduce_pool_q4w",
    "edw_pool_q4w_non_negative"
  ],
  "smt_timeout": "7200",
  "mutations": {
    "manual_mutants": [
      {
        "file_to_mutate": "../src/backstop/withdrawal.rs",
        "mutants_location": "../mutations/withdraw-merged"
      }
    ]
  }
}