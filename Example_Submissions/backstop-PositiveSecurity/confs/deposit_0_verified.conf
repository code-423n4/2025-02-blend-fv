{
  "build_script": "../certora_build.py",
  "optimistic_loop": true,
  "precise_bitwise_ops": true,
  "process": "emv",
  "rule": [
    "execute_deposit_mints_positive_shares",
    "deposit_calculates_correct_shares_0",
    "execute_deposit_negative_amount_fails",
    "execute_deposit_from_pool_fails",
    "execute_deposit_from_contract_fails"
  ],
  "mutations": {
    "manual_mutants": [
      {
        "file_to_mutate": "../src/backstop/deposit.rs",
        "mutants_location": "../mutations/deposit-merged"
      }
    ]
  }
}