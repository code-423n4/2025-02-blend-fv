{
  "build_script": "../certora_build.py",
  "optimistic_loop": true,
  "precise_bitwise_ops": true,
  "process": "emv",
  "rule": [
    "amount_to_withdraw_nonnegative",
    "withdraw_queue_only_positive",
    "execute_queue_withdrawal_decreases_ub",
    "execute_queue_withdrawal_increases_pb_q4w_only",
    "execute_queue_balance_error_fails",
    "execute_queue_too_many_q4w_fails",
    "withdraw_dequeue_only_positive",
    "withdraw_dequeue_insufficient_balance_fails",
    "withdraw_empty_pool_fails",
    "execute_withdraw_balance_error_fails"
  ],
  "server": "production",
  "mutations": {
    "manual_mutants": [
      {
        "file_to_mutate": "../src/backstop/withdrawal.rs",
        "mutants_location": "../mutations/withdraw-merged"
      }
    ]
  }
}